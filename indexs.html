<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Checker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            width: 350px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 15px 0;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            border: none;
            background: black;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Palindrome Checker</h2>

        <input 
            type="text" 
            id="textInput" 
            placeholder="Enter a word"
        >

        <button onclick="checkPalindrome()">
            Check
        </button>

        <p id="result"></p>

    </div>

    <script>

        function checkPalindrome() {

            let input = document.getElementById("textInput").value;

            let original = input.toLowerCase();

            let reversed = original.split("").reverse().join("");

            if (original === reversed) {
                document.getElementById("result").innerText =
                    "It is a Palindrome ✅";
            } 
            else {
                document.getElementById("result").innerText =
                    "It is not a Palindrome ❌";
            }
        }

    </script>
</body>
</html>
